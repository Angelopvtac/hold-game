<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a1c">
<title>HOLD</title>
<link rel="stylesheet" href="/hold/fonts/fonts.css">
<style>
/* AGREE-QUIZ (18 Nov) on the phone: pick alone, then see your partner's pick and agree. */
.qhd{font:700 14px var(--fd);letter-spacing:.2em;color:var(--cyan)}
.qtx{width:min(88vw,340px);font:800 19px/1.3 var(--fu);text-align:center;margin:6px 0 10px}
.qb{width:min(88vw,340px);border:0;border-radius:20px;padding:12px 14px;margin-top:8px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--ink);background:#141d4a;box-shadow:inset 0 0 0 2px #22e4ff44;font:800 17px/1.25 var(--fu);position:relative;transition:opacity .2s,transform .12s}
.qb:active{transform:scale(.97)}
.qb .l{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 22px var(--fd);color:var(--n0);background:linear-gradient(180deg,#7ef4ff,#22e4ff)}
.qb.mine{background:#0f2f5e;box-shadow:inset 0 0 0 3px #22e4ff}
.qb.dim{opacity:.4}
.qb[disabled]{cursor:default}
.qb .mt{position:absolute;right:10px;top:-9px;font:700 11px var(--fd);letter-spacing:.08em;padding:3px 8px;border-radius:8px;background:#ffb627;color:var(--n0)}
.qb.ok{background:#0b2a22;box-shadow:inset 0 0 0 3px var(--mint)}.qb.ok .l{background:linear-gradient(180deg,#a8ffd6,#5dffb0)}
.qst{width:min(88vw,340px);margin-top:12px;border-radius:18px;padding:10px 14px;text-align:center;font:800 16px/1.35 var(--fu);background:#0b1236e6;box-shadow:inset 0 0 0 2px #22e4ff44}
.qst.split{box-shadow:inset 0 0 0 2px #ffb627;color:#ffe3a3}.qst.agree{box-shadow:inset 0 0 0 2px var(--mint);color:#c9ffe6}
.qtime{margin-top:10px;font:800 13px var(--fu);letter-spacing:.14em;color:var(--dim)}.qtime b{font:700 26px var(--fd);color:var(--amber);margin-right:6px}
.qwhy2{width:min(88vw,340px);margin-top:10px;font:800 15px/1.35 var(--fu);color:#d9d6f5;text-align:center}
.bkp{width:min(88vw,340px);margin-top:8px;border-radius:16px;padding:8px 12px;background:#0b2a22cc;box-shadow:inset 0 0 0 2px #5dffb055;font:800 14px/1.3 var(--fu);text-align:center}
.bkp .cells{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}.bkp .cells i{width:46px;height:12px;border-radius:4px;background:#1d2a66;box-shadow:inset 0 0 0 1.5px #5dffb0aa}.bkp .cells i.f{background:var(--mint)}
.bkp b{color:var(--mint)}
.syncl{margin-top:6px;font:700 18px var(--fd);letter-spacing:.06em;color:#7ef4ff}
/* The phone, TWO KEYS (15 Nov): every member holds the big button (labelled with the message's button), sees the
   team pot and their partner's thumb, live. Never the message text: that is on the big screen.
   Cyber look (16 Nov, Angelo picked B2): the neon city behind, you and your partner as Human Firewall defenders,
   an arcade dome to hold. Fredoka + Nunito, vendored. Safe areas respected. */
:root{--n0:#060a1c;--n1:#0c1333;--n3:#1d2a66;--cyan:#22e4ff;--mag:#ff4fd8;--amber:#ffb627;--amber2:#b36a00;--mint:#5dffb0;--ink:#f3f1ff;--dim:#93a0d8;--soft:#ff8fb8;
  --fd:'Fredoka',ui-rounded,system-ui,sans-serif;--fu:'Nunito',ui-rounded,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.5,.35,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--n0);color:var(--ink);font-family:var(--fu);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.sky{position:absolute;inset:0;background:radial-gradient(500px 420px at 80% 0%,#ff4fd820,transparent 70%),radial-gradient(500px 420px at 10% 0%,#22e4ff1a,transparent 70%),linear-gradient(180deg,#0d1438,var(--n0))}
.grid{position:absolute;inset:0;background-image:linear-gradient(#22e4ff10 1px,transparent 1px),linear-gradient(90deg,#22e4ff10 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(80% 50% at 50% 30%,#000,transparent);mask-image:radial-gradient(80% 50% at 50% 30%,#000,transparent)}
.pworld{position:absolute;left:0;bottom:0;width:100%;height:100%}
body.caught .sky{background:radial-gradient(500px 420px at 50% 22%,#ff4fd826,transparent 70%),linear-gradient(180deg,#120f3a,var(--n0))}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flick{animation:fl 3s infinite}@keyframes fl{0%,48%,52%,100%{opacity:1}50%{opacity:.4}}
.glow{animation:gl 1.8s ease-in-out infinite}@keyframes gl{50%{opacity:.5}}
.hand{animation:press 1.8s ease-in-out infinite}@keyframes press{50%{transform:translateY(2px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:none}}

.pscreen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--st) + 74px) 20px calc(var(--sb) + 24px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.pscreen>*{pointer-events:none}
.ptop{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 12px) 16px 0;z-index:3;pointer-events:none;gap:10px}
.me{display:flex;align-items:center;gap:8px;font:700 16px var(--fd);letter-spacing:.03em;background:#080d26d9;border-radius:999px;padding:4px 14px 4px 6px;box-shadow:inset 0 0 0 2px #22e4ff22;min-width:0;max-width:62vw}
.me svg{width:34px;height:38px;flex:none}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bankt{font:600 12px var(--fd);letter-spacing:.14em;color:var(--dim);text-align:right;white-space:nowrap}
.bankt b{display:block;font:700 22px var(--fd);color:var(--ink);letter-spacing:.02em}

.pbig{font:700 44px/1 var(--fd);letter-spacing:.01em}
.psm{font:800 15px/1.45 var(--fu);margin-top:12px;color:var(--dim)}
.psm b{color:var(--ink)}
.look{font:700 17px var(--fd);letter-spacing:.1em;color:var(--ink);margin-top:14px;background:#080d26d9;border-radius:999px;padding:10px 20px;box-shadow:inset 0 0 0 2px #ffffff12}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px}
.goal span{white-space:nowrap;font:700 13px var(--fd);letter-spacing:.08em;padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:8px}
.goal .g1{color:var(--n0);background:linear-gradient(180deg,#ffd05a,var(--amber))}
.goal .g2{color:#ffd0f4;background:#2a0c34d9;box-shadow:inset 0 0 0 2px #ff4fd855}

/* the pot */
.potrow{display:flex;align-items:center;justify-content:center;gap:10px}
.potrow svg{width:50px;height:56px;flex:none}
.pot{display:inline-block;white-space:nowrap;font:700 78px/1 var(--fd);color:var(--amber);text-shadow:0 6px 0 var(--amber2),0 14px 40px #ff8f1f55;font-variant-numeric:tabular-nums}
.pot.locked{color:#3a4790;text-shadow:none}
.pot.beat{animation:beat .2s ease-out}@keyframes beat{40%{transform:scale(1.05)}}
.pot.jump{animation:jump .45s var(--spring)}@keyframes jump{35%{transform:scale(1.18)}}
.potl{font:700 13px var(--fd);letter-spacing:.2em;color:var(--dim);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px}
.mult{background:var(--amber);color:var(--n0);border-radius:9px;padding:1px 10px;font:700 17px var(--fd);letter-spacing:.02em;transform:rotate(-4deg);display:inline-block}
.jumpf{position:fixed;left:50%;z-index:4;font:700 24px/1 var(--fd);color:var(--n0);background:linear-gradient(180deg,#ffd05a,var(--amber));border-radius:999px;padding:7px 16px;box-shadow:0 4px 0 var(--amber2),0 10px 24px #0008;white-space:nowrap;pointer-events:none;animation:jf .8s var(--ease) forwards;transform:translateX(-50%)}
@keyframes jf{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}82%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-32px) scale(.85);visibility:hidden}}

/* partner chips */
.mates{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;min-height:46px}
.mate{display:flex;align-items:center;gap:10px;background:#080d26d9;border-radius:999px;padding:4px 18px 4px 6px;font:700 16px var(--fd);box-shadow:inset 0 0 0 2px #22e4ff44;white-space:nowrap}
.mate svg{width:36px;height:40px}
.mate b{color:var(--cyan)}
.mate.off{box-shadow:inset 0 0 0 2px #ff4fd855}.mate.off b{color:var(--soft)}
.mate.off b{animation:mb 1.2s ease-in-out infinite}@keyframes mb{50%{opacity:.45}}

/* the big button */
.bigbtn{width:min(84vw,330px);aspect-ratio:330/300;margin-top:4px;flex:none}
.bigbtn svg{width:100%;height:100%;overflow:visible}
.bigbtn.on{animation:none}
.bigbtn.idle svg{animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.02)}}
.tip{font:800 15px/1.5 var(--fu);color:var(--dim);margin-top:2px}
.tip b{color:var(--ink)}.tip .r{color:var(--mag)}
.role{font:700 14px var(--fd);letter-spacing:.14em;padding:8px 16px;border-radius:999px;background:#0a2a44;color:#bfe9ff;box-shadow:inset 0 0 0 2px #22e4ff66}
.role.ok{background:#0a2a22;color:var(--mint);box-shadow:inset 0 0 0 2px #5dffb066}
.role.so{background:#2e2410;color:var(--amber);box-shadow:inset 0 0 0 2px #ffb62766}
.stake{font:700 14px var(--fd);letter-spacing:.14em;color:var(--amber);margin-bottom:10px}

/* scenes */
.scene{width:min(88vw,346px);aspect-ratio:346/250;flex:none}
.scene svg{width:100%;height:100%;overflow:visible}
.tscene{width:min(80vw,312px);aspect-ratio:312/158;flex:none;margin:6px 0}
.tscene svg{width:100%;height:100%;overflow:visible}
.h1{font:700 30px/1.1 var(--fd);margin-top:8px}
.h1.p{color:#ffc6ec}.h1.g{color:#ffe3a3}.h1.m{color:var(--mint)}
.bigv{white-space:nowrap;font:700 clamp(40px,15vw,72px)/1 var(--fd);color:var(--amber);text-shadow:0 6px 0 var(--amber2),0 14px 40px #ff8f1f55;margin-top:6px;font-variant-numeric:tabular-nums}
.bigv.m{color:var(--mint);text-shadow:0 6px 0 #0d7a4c,0 14px 40px #5dffb044}
.bigv.lost{color:#e9b6dc;text-shadow:none;text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#ff4fd8aa}
.safe{margin-top:14px;display:inline-flex;align-items:center;gap:10px;background:#080d26d9;box-shadow:inset 0 0 0 2px #5dffb044;border-radius:999px;padding:9px 20px;font:700 16px var(--fd)}
.safe b{color:var(--mint)}
.cons{margin-top:10px;font:800 15px var(--fu);color:#ffc6ec;background:#2a0c34;border-radius:14px;padding:8px 14px}
.who{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;font:700 16px var(--fd);letter-spacing:.06em;color:var(--mag);background:#1e0a2ae6;border-radius:999px;padding:4px 18px 4px 6px;box-shadow:inset 0 0 0 2px #ff4fd855}
.who svg{width:44px;height:52px}
.stg{font:700 18px var(--fd);letter-spacing:.3em;color:var(--dim)}
.stx{font:700 140px/.9 var(--fd);color:var(--amber);text-shadow:0 10px 0 var(--amber2),0 20px 60px #ff8f1f55;margin-top:12px;animation:stamp .6s var(--spring) both}
@keyframes stamp{from{opacity:0;transform:scale(1.3)}}
.stx.go{font-size:72px;color:var(--cyan);text-shadow:0 8px 0 #0a7a9a,0 20px 60px #22e4ff55}
.stx.fin{font-size:82px;color:var(--mag);text-shadow:0 8px 0 #8a0d5c,0 20px 60px #ff4fd855}
.medal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:700 52px var(--fd);color:var(--n0);background:#93a0d8;box-shadow:0 6px 0 #4a58a0,0 0 40px #93a0d855;animation:pop .6s var(--spring)}
.medal.r1{background:var(--amber);box-shadow:0 6px 0 var(--amber2),0 0 50px #ffb62788}.medal.r2{background:#dfe3f5;box-shadow:0 6px 0 #8a92b8}.medal.r3{background:#d9915a;box-shadow:0 6px 0 #8a5228}
.wpot{font:700 64px/1 var(--fd);font-variant-numeric:tabular-nums;color:#3a4790;transition:color .25s}
.wpot.on{color:var(--amber);text-shadow:0 6px 0 var(--amber2),0 14px 40px #ff8f1f55}
.wait{font:700 30px/1.1 var(--fd);color:var(--amber)}

/* pairing (lobby): real buttons, outside the hold pad */
.pairui{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:calc(var(--st) + 70px) 20px calc(var(--sb) + 20px)}
.pairui h1{font:700 36px/1.05 var(--fd)}
.pairui h1 em{font-style:normal;color:var(--cyan)}
.bigb{width:min(86vw,340px);height:66px;border-radius:999px;font:700 20px/1 var(--fd);letter-spacing:.08em;cursor:pointer;background:#080d26e6;color:#fff;border:0;box-shadow:inset 0 0 0 2px #22e4ff55,0 10px 24px #0007;transition:transform .12s}
.bigb:active{transform:scale(.98)}
.nmin{width:min(86vw,340px);height:62px;border-radius:18px;border:0;background:#080d26e6;box-shadow:inset 0 0 0 2px #22e4ff66;color:#fff;font:700 28px/1 var(--fd);text-align:center;letter-spacing:.02em;outline:none}
.nmin:focus{box-shadow:inset 0 0 0 3px var(--cyan),0 0 24px #22e4ff44}.nmin::placeholder{color:#5a6699}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(88vw,340px)}
.avb{aspect-ratio:1/1.05;border-radius:16px;border:0;background:#0b1236e6;box-shadow:inset 0 0 0 2px #2a3570;cursor:pointer;padding:6px 4px 0;display:grid;place-items:end center;transition:transform .1s}
.avb svg{width:100%;height:100%;overflow:hidden;pointer-events:none}.avb{overflow:hidden}.avb.on{background:#123a4a;box-shadow:inset 0 0 0 3px var(--cyan),0 0 18px #22e4ff55;transform:scale(1.05)}
.bigb.go{background:linear-gradient(180deg,#7ff3ff,var(--cyan));color:var(--n0);box-shadow:0 6px 0 #0a7a9a,0 14px 30px #22e4ff44}
.linkb{background:none;border:0;color:var(--dim);font:700 13px var(--fd);letter-spacing:.14em;cursor:pointer;padding:12px;text-decoration:underline;text-underline-offset:4px}
.code{font:700 96px/1 var(--fd);letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 40px #22e4ff66;padding:14px 22px 14px 36px;border-radius:28px;background:#080d26e6;box-shadow:inset 0 0 0 2px #22e4ff66;font-variant-numeric:tabular-nums}
.slots{display:flex;gap:10px}.slots b{width:66px;height:80px;border-radius:18px;background:#080d26e6;box-shadow:inset 0 0 0 2px #22e4ff55;display:grid;place-items:center;font:700 46px/1 var(--fd);color:var(--cyan)}
.slots b:empty{box-shadow:inset 0 0 0 2px #ffffff22}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(86vw,300px)}
.keys button{height:58px;border-radius:18px;border:0;background:#141d4a;font:700 28px/1 var(--fd);cursor:pointer;box-shadow:inset 0 -4px 0 #0a1036,inset 0 0 0 2px #22e4ff1c;transition:transform .08s}
.keys button:active{transform:scale(.95);background:#1d2a66}
.keys button[data-a]{font:700 14px/1 var(--fd);letter-spacing:.1em;color:var(--dim)}
.okc{font:700 15px var(--fd);color:var(--mint);letter-spacing:.18em}
.hint{font:800 15px/1.45 var(--fu);color:var(--dim)}
.hint b{color:var(--ink);font-family:var(--fd);font-size:20px}
.err{color:var(--soft);font:800 15px/1.3 var(--fu);min-height:20px}
/* PIN entry */
.form{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.logo{font:700 86px/1 var(--fd);letter-spacing:.02em;display:flex;align-items:center}
.logo svg{width:66px;height:76px;margin:0 2px}
.pin-input{width:min(80vw,300px);font:700 44px/1 var(--fd);text-align:center;letter-spacing:.16em;background:#080d26e6;border:0;box-shadow:inset 0 0 0 2px #22e4ff44;border-radius:22px;padding:16px 8px;color:#fff;outline:none;transition:box-shadow .2s}
.pin-input:focus{box-shadow:inset 0 0 0 3px var(--cyan),0 0 0 6px #22e4ff22}
.cta{background:linear-gradient(180deg,#7ff3ff,var(--cyan));color:var(--n0);border:0;border-radius:999px;height:64px;padding:0 60px;font:700 28px/1 var(--fd);letter-spacing:.12em;cursor:pointer;box-shadow:0 6px 0 #0a7a9a,0 14px 30px #22e4ff44}
.prac{position:fixed;top:calc(var(--st) + 60px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--fd);letter-spacing:.16em;color:#bfe9ff;padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 2px #22e4ff66;background:#0a2a44;z-index:3;pointer-events:none}
.conn{position:fixed;bottom:calc(var(--sb) + 12px);left:50%;transform:translateX(-50%);font:700 12px var(--fd);letter-spacing:.14em;color:#fff;background:#2a0c34;box-shadow:inset 0 0 0 2px #ff4fd866;border-radius:999px;padding:8px 14px;z-index:6;pointer-events:none}
/* acts (16 Nov): the act card, SAFE or BOLD, the marks, the awards */
.pact{font:700 15px var(--fd);letter-spacing:.26em;color:var(--n0);background:linear-gradient(180deg,#7ef4ff,var(--cyan));padding:6px 16px;border-radius:999px}
.ptitle{font:700 32px/1.08 var(--fd);margin:12px 0 4px}
.ptitle span{color:var(--amber)}
.pq{font:800 17px/1.35 var(--fu);color:#d9d6f5;margin:2px 0 6px}
.opt{width:min(88vw,340px);border:0;border-radius:24px;padding:14px 18px;display:flex;align-items:center;gap:14px;text-align:left;position:relative;cursor:pointer;color:var(--ink);transition:transform .12s,opacity .2s}
.opt .ic{font-size:38px;width:52px;text-align:center;flex:none}
.opt .ot{display:block;font:700 30px var(--fd);letter-spacing:.04em}
.opt .od{display:block;font:800 15px/1.3 var(--fu);color:#d9d6f5;margin-top:2px}
.opt.safe{background:#0a2a3a;box-shadow:inset 0 0 0 3px #22e4ff66}.opt.safe .ot{color:#bff8ff}
.opt.bold{background:linear-gradient(180deg,#3a1a06,#2a1204);box-shadow:inset 0 0 0 3px #ff9a3c88}.opt.bold .ot{color:#ffb627}
.opt.picked{transform:scale(1.03);box-shadow:inset 0 0 0 4px #ffb627,0 0 40px #ffb62766}
.opt.safe.picked{box-shadow:inset 0 0 0 4px #bff8ff,0 0 40px #22e4ff66}
.opt.dim{opacity:.4}
.opt .tick{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:var(--n0);display:grid;place-items:center;font:700 20px var(--fd)}
.ctime{display:flex;align-items:center;gap:10px;font:700 14px var(--fd);letter-spacing:.16em;color:var(--dim)}
.ctime b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--fd);color:var(--amber);box-shadow:inset 0 0 0 3px var(--amber)}
.pres{width:min(88vw,340px);border-radius:24px;padding:18px 16px;animation:pop .6s var(--spring) both}
.pres.bold{background:linear-gradient(180deg,#ffcf5a,#ff8a1f);color:#2a1200;box-shadow:0 8px 0 #a34a00,0 0 50px #ff9a3c55}
.pres.psafe{background:#0a2a3a;color:#bff8ff;box-shadow:inset 0 0 0 3px #22e4ff88,0 0 50px #22e4ff33}
.pres.spot{background:linear-gradient(180deg,#7dffc4,#2ed39a);color:#03241a;box-shadow:0 8px 0 #138a62,0 0 50px #5dffb055}
.pres.early{background:#2a2410;color:#ffe08a;box-shadow:inset 0 0 0 3px #ffb62777}
.pres.tap{background:#2a0c34;color:#ffc6ec;box-shadow:inset 0 0 0 3px #ff4fd877}
.pres .rt1{font:700 34px var(--fd);letter-spacing:.03em}
.pres .rt2{font:800 16px/1.35 var(--fu);margin-top:4px}
.pairc{display:flex;gap:10px;width:min(88vw,340px)}
.pairc .pc{flex:1;border-radius:18px;background:#080d26e6;box-shadow:inset 0 0 0 2px #2a3570;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px var(--fd);letter-spacing:.06em;color:var(--dim);min-width:0}
.pairc .pc svg{width:36px;height:42px}

.cbar{width:min(88vw,340px);height:22px;border-radius:999px;background:#0a1036;box-shadow:inset 0 0 0 2px #ffffff18;overflow:hidden;margin-top:8px;position:relative}

.cneed{font:800 15px var(--fu);color:var(--dim);margin-top:6px}.cneed b{color:var(--ink)}
.ccount{font:700 44px/1 var(--fd);color:var(--amber);margin-top:2px}

.rep{width:min(92vw,350px);border-radius:24px;padding:14px 16px 12px;background:linear-gradient(180deg,#121a4a,#0a1036);box-shadow:inset 0 0 0 2px #22e4ff44,0 14px 30px #0008;text-align:left}

.rep .rk{font:800 11px var(--fu);letter-spacing:.2em;color:var(--dim)}
.rep .rn{font:700 22px/1.1 var(--fd);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .rr{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.rep .st{font:700 13px var(--fd);letter-spacing:.1em;padding:4px 10px;border-radius:9px;background:#0b2a22;color:var(--mint);box-shadow:inset 0 0 0 2px #5dffb066}
.rep.closed .st{background:#2a0c34;color:#ffc6ec;box-shadow:inset 0 0 0 2px #ff4fd866}

.rep .stats{display:flex;gap:8px;margin-top:10px}
.rep .stats .s{flex:1;border-radius:14px;background:#080d26;box-shadow:inset 0 0 0 2px #2a3570;padding:6px 4px;text-align:center}
.rep .stats b{display:block;font:700 22px var(--fd)}.rep .stats b.g{color:var(--mint)}.rep .stats b.m{color:#ff8fd8}
.rep .stats span{font:800 10px var(--fu);letter-spacing:.14em;color:var(--dim)}
.rep .bar{height:8px;border-radius:999px;background:#1a2150;margin-top:10px;overflow:hidden}.rep .bar i{display:block;height:100%;background:linear-gradient(90deg,#22e4ff,#5dffb0)}

.rbldg{width:120px;height:150px;margin-top:6px}.rbldg svg{width:100%;height:100%;overflow:visible}
.showhint{font:800 15px var(--fu);color:var(--dim);margin-top:4px}.showhint b{color:var(--cyan)}
.bitbyl{font:800 13px var(--fu);color:#6f7cb8;margin-top:6px}.bitbyl a{color:var(--cyan);text-decoration:none}

.rtag{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--fd);letter-spacing:.2em;color:#ffd0f4;background:#2a0c34;box-shadow:inset 0 0 0 2px #ff4fd866;border-radius:999px;padding:6px 16px}

.rbars{width:min(88vw,340px);display:flex;flex-direction:column;gap:8px;margin-top:10px}

.rb.us span{color:var(--amber)}

<body>
<div class="bg"><div class="sky"></div><div class="grid"></div><svg class="pworld" id="pworld" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg></div>
<div class="pscreen" id="pad"></div>
<div class="pairui" id="pairui" hidden></div>
<div class="pairui" id="choiceui" hidden></div>
<div class="ptop" id="top" hidden><span class="me" id="me"></span><span class="bankt">REVENUE<b id="bank">R0</b></span></div>
<div class="prac" id="prac" hidden>PRACTICE · DOESN'T COUNT</div>
<div class="form" id="form" hidden>
  <div class="logo" id="flogo"></div>
  <div class="psm" style="margin:0">GAME PIN FROM THE BIG SCREEN</div>
  <input id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Game PIN">
  <button class="cta" id="joinBtn" type="button">JOIN</button>
  <div class="err" id="err"></div>
</div>
<div class="conn" id="conn" hidden>RECONNECTING…</div>
<script type="module">
import { createSocket } from '/client/net.js';
import * as A from '/hold/art.js';
const $ = (s) => document.querySelector(s);
const pad = $('#pad');
const potAt = (t) => Math.round(600 * t + 200 * t * t); // server/hold/rules.js
const TOKEN_KEY = 'hold_token';
const store = (fn) => { try { return fn(localStorage); } catch { return null; } };
let token = store((s) => s.getItem(TOKEN_KEY));
let pin = new URLSearchParams(location.search).get('pin') || null;
let Y = null, off = 0, view = '', down = false, lastBonus = 0, nextBeat = 0, frozen = null, myName = '', myAv = null;
let pairMode = 'menu', typed = '', pairErr = '', pairView = '';
// 19 Nov: the name + character step (lobby). profOpen: showing it; profDraft/profAv: what's typed/picked; profErr: the server's no.
let profOpen = null, profDraft = null, profAv = null, profErr = '';
const now = () => Date.now() + off;
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
$('#pworld').innerHTML = A.world(390, 844, true);
$('#flogo').innerHTML = A.logo();

const sock = createSocket(onMsg, '/hold/ws');
sock.onopen = () => sock.send({ t: 'join', role: 'player', token: token || undefined, pin: pin || undefined });
sock.onstatus = (s) => { $('#conn').hidden = s === 'online'; };

function onMsg(m) {
  if (m.t === 'welcome') { token = m.token; store((s) => s.setItem(TOKEN_KEY, token)); $('#form').hidden = true; $('#top').hidden = false; myName = m.name; drawMe('hold'); if (m.pin) history.replaceState(null, '', '/hold'); }
  else if (m.t === 'need_join') { token = null; store((s) => s.removeItem(TOKEN_KEY)); Y = null; view = ''; if (m.reason === 'reset') pin = null; pin ? sock.send({ t: 'join', role: 'player', pin }) : pinScreen(m.reason === 'reset' ? 'The host started a new lobby. Enter the new PIN.' : ''); }
  else if (m.t === 'pin_bad') { pin = null; pinScreen(m.message); }
  else if (m.t === 'error') { $('#err').textContent = m.message; }
  else if (m.t === 'pair_bad') { pairErr = m.message; typed = ''; drawPair(true); }
  else if (m.t === 'profile') { if (profSent) { profSent = false; if (m.ok) { profOpen = false; profErr = ''; profDraft = null; } else profErr = m.message || 'Pick another name.'; } if (Y) drawPair(true); }
  else if (m.t === 'you') { off = m.you.now - Date.now(); const prev = Y; Y = m.you; myName = Y.name || myName; myAv = Number.isInteger(Y.av) ? Y.av : null; draw(prev); }
}
function drawMe(mood) { const k = myName + mood + myAv; const e = $('#me'); if (e.dataset.k === k) return; e.dataset.k = k; e.innerHTML = `${A.avatar(A.lookOf({ name: myName, av: myAv }), mood)}<span>${esc(myName.toUpperCase())}</span>`; }
function pinScreen(msg) {
  $('#form').hidden = false; $('#top').hidden = true; $('#err').textContent = msg || '';
  setTimeout(() => $('#pinInput').focus(), 50);
}
const submitPin = () => { const v = $('#pinInput').value.trim(); if (!/^\d{6}$/.test(v)) { $('#err').textContent = 'The PIN is 6 digits.'; return; } pin = v; sock.send({ t: 'join', role: 'player', pin }); };
$('#joinBtn').addEventListener('click', submitPin);
$('#pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPin(); });

// ---- screens ----
function screen(html, mood = 'hold', caught = false) { pad.className = 'pscreen'; pad.innerHTML = html; drawMe(mood); document.body.classList.toggle('caught', caught); }
function viewKey() {
  const y = Y; if (!y) return '';
  const k = [y.phase, y.index, y.state, y.solo ? 'solo' : '', y.practice ? 'p' : '', y.away ? 'away' : ''];
  if (y.phase === 'walk') k.push(y.walk.step, down || y.down ? 'down' : 'up', y.keysIn ? 'in' : '');
  if (y.phase === 'stage') k.push(y.stage.kind, y.stage.act, y.stage.locked, y.mode);
  if (y.phase === 'ready') k.push(down || y.down ? 'down' : 'up', y.keysIn ? 'in' : '');
  if (y.phase === 'play' && (y.state === 'hold' || y.state === 'wait')) k.push(down ? 'down' : 'letting');
  if (y.phase === 'crash') k.push(y.outcome, y.mark, y.contain ? y.contain.step + y.contain.role + (y.contain.result || '') : '');
  k.push(y.sync ? 'sync' : '', y.backup ? 'b' + y.backup.have : '', y.restored ? 'r' + (y.restored.now ? 'n' : '') : '');
  if (y.phase === 'ransom' && y.ransom) k.push(y.ransom.duel, y.ransom.step, y.ransom.role, y.ransom.result ? y.ransom.result.kind : '');
  return k.join(':');
}
// A teammate's short name: the first word, or the full name when two in the team share it (COBALT HERON vs COBALT KOI).
const first = (n) => { const f = (n || '').split(' ')[0].toUpperCase(); const team = Y ? [Y.name, ...((Y.mates || []).map((m) => m.name))] : []; return team.filter((x) => x.split(' ')[0].toUpperCase() === f).length > 1 ? (n || '').toUpperCase() : f; };
const names = (a) => (a || []).map(first).join(' & ');
// Rand, South African style: R42 180.
const money = (v) => 'R' + String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Your team as a drawing: you first, then your partners. on: whose key is in.
function teamArt(y, st, opts = {}) {
  const ms = [{ c: A.lookOf(y, myName), on: opts.meOn ?? true }, ...((y.mates || []).map((m) => ({ c: A.lookOf(m), on: opts.mateOn ?? !!m.down })))];
  return `<div class="tscene">${A.team(ms, st)}</div>`;
}

// ---- pairing (lobby, or anyone still unpaired between messages) ----
function pairing() { return Y && Y.phase !== 'play' && Y.phase !== 'crash' && (Y.phase === 'lobby' || !Y.pair) && Y.phase !== 'final'; }
function drawPair(force) {
  const ui = $('#pairui'), y = Y;
  if (!pairing()) { ui.hidden = true; pairView = ''; return false; }
  ui.hidden = false;
  if (profOpen === null) profOpen = y.phase === 'lobby' && !y.named; // first time in: ask once
  if (profOpen && y.phase === 'lobby') {
    if (profDraft === null) profDraft = ''; if (profAv === null) profAv = Number.isInteger(y.av) ? y.av : null;
    const key = ['prof', profAv, profErr].join('|');
    if (key === pairView && !force) return true;
    pairView = key;
    const grid = A.LOOKS.map((L, i) => `<button type="button" class="avb${profAv === i ? ' on' : ''}" data-av="${i}" aria-label="${esc(L.name)}">${A.avatar(L.c + '|' + L.a, profAv === i ? 'happy' : 'idle')}</button>`).join('');
    ui.innerHTML = `<div class="psm" style="margin:0 0 4px;letter-spacing:.2em">WHO ARE YOU?</div>`
      + `<input id="profName" class="nmin" type="text" inputmode="text" autocomplete="nickname" autocapitalize="words" spellcheck="false" maxlength="12" placeholder="${esc(y.name)}" value="${esc(profDraft)}">`
      + `<div class="err">${esc(profErr)}</div><div class="psm" style="margin:4px 0 6px;letter-spacing:.2em">PICK YOUR CHARACTER</div><div class="avg">${grid}</div>`
      + `<button class="bigb go" type="button" data-p="save" style="margin-top:12px">THAT'S ME</button><button class="linkb" type="button" data-p="skip">SKIP · STAY ${esc(y.name.toUpperCase())}</button>`;
    const inp = $('#profName'); inp.addEventListener('input', () => { profDraft = inp.value; profErr = ''; const e = ui.querySelector('.err'); if (e) e.textContent = ''; });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveProfile(); } });
    return true;
  }
  if (y.pair) pairMode = 'menu';
  const key = [y.pair ? y.pair.mates.join() : '', y.code, pairMode, typed, pairErr].join('|');
  if (key === pairView && !force) return true;
  pairView = key;
  let h;
  if (y.pair) {
    const ms = [{ c: A.lookOf(y), on: true }, ...y.pair.mates.map((n, i) => ({ c: A.lookOf({ name: n, av: (y.pair.avs || [])[i] }), on: true }))];
    h = `<div class="okc">✓ YOUR TEAM</div><div class="tscene">${A.team(ms, 'banked')}</div><h1>${esc(first(y.name))} & <em>${esc(names(y.pair.mates))}</em> LTD</h1><div class="hint">YOUR COMPANY: YOU BOTH HOLD.<br>ONE LETS GO = YOU BOTH LOCK IN.</div>`
      + (y.code && y.pair.size < 3 ? `<div class="hint" style="margin-top:10px">ODD ONE OUT NEXT TO YOU?<br>THEY CAN TYPE YOUR CODE <b>${esc(y.code)}</b></div>` : '')
      + (y.phase === 'lobby' ? `<button class="linkb" type="button" data-a="unpair">NOT THEM? UNPAIR</button><button class="linkb" type="button" data-p="edit">CHANGE MY NAME OR CHARACTER</button>` : '')
      + `<div class="look">LOOK UP AT THE BIG SCREEN ↑</div>`;
  } else if (pairMode === 'show') {
    h = `<div class="psm" style="margin:0;letter-spacing:.2em">YOUR CODE</div><div class="code">${esc(y.code || '···')}</div><div class="hint">YOUR NEIGHBOUR TYPES IT<br>ON THEIR PHONE</div><button class="linkb" type="button" data-a="menu">BACK</button>`;
  } else if (pairMode === 'enter') {
    const sl = [0, 1, 2].map((i) => `<b>${esc(typed[i] || '')}</b>`).join('');
    h = `<div class="psm" style="margin:0;letter-spacing:.2em">THEIR CODE</div><div class="slots">${sl}</div><div class="err">${esc(pairErr)}</div><div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-a="menu">BACK</button><button type="button" data-k="0">0</button><button type="button" data-a="del">⌫</button></div>`;
  } else {
    const ms = [{ c: A.lookOf(y), on: false }, { c: '#3a4790', on: false }];
    h = `<div class="tscene">${A.team(ms, 'idle')}</div><h1>PAIR WITH THE PERSON<br><em>NEXT TO YOU</em></h1><div class="hint" style="margin:0 0 6px">ONE SHOWS, THE OTHER TYPES</div><button class="bigb go" type="button" data-a="show">SHOW MY CODE</button><button class="bigb" type="button" data-a="enter">ENTER THEIR CODE</button><div class="hint" style="margin-top:8px">NOBODY NEXT TO YOU? YOU'LL PLAY SOLO</div>${y.phase === 'lobby' ? `<button class="linkb" type="button" data-p="edit">CHANGE MY NAME OR CHARACTER</button>` : ''}`;
  }
  ui.innerHTML = GOAL + h;
  drawMe('hold');
  return true;
}
$('#pairui').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.av !== undefined) { profAv = +b.dataset.av; profErr = ''; drawPair(true); return; }
  if (b.dataset.p === 'save') { saveProfile(); return; }
  if (b.dataset.p === 'skip') { if (profAv !== null) sock.send({ t: 'profile', av: profAv }); else sock.send({ t: 'profile', name: '' }); profOpen = false; drawPair(true); return; }
  if (b.dataset.p === 'edit') { profOpen = true; profDraft = null; profErr = ''; drawPair(true); return; }
  if (b.dataset.k) { if (typed.length < 3) typed += b.dataset.k; pairErr = ''; if (typed.length === 3) sock.send({ t: 'pair', code: typed }); }
  else if (b.dataset.a === 'del') { typed = typed.slice(0, -1); pairErr = ''; }
  else if (b.dataset.a === 'unpair') sock.send({ t: 'unpair' });
  else if (b.dataset.a) { pairMode = b.dataset.a; typed = ''; pairErr = ''; }
  drawPair(true);
});

function saveProfile() {
  const v = (profDraft || '').replace(/\s+/g, ' ').trim();
  if (v && (v.length < 2 || v.length > 12)) { profErr = '2 to 12 characters.'; drawPair(true); return; }
  sock.send({ t: 'profile', name: v || '', av: profAv });
  profSent = true;
}
let profSent = false;
// ---- SAFE or BOLD (acts 2 and 3): real buttons over the hold pad, while the act card's choice is open ----
const actTitle = (name) => { const w = (name || '').split(' '), h = Math.floor(w.length / 2); return esc(w.slice(0, h).join(' ')) + (h ? ' ' : '') + `<span>${esc(w.slice(h).join(' '))}</span>`; };
const pickLabel = (p) => (p === 'bold' ? '🔥 BOLD' : p === 'safe' ? '🛡 SAFE' : 'choosing…');
function choosing() { const y = Y; return y && y.phase === 'stage' && y.stage && y.stage.kind === 'act' && y.stage.choice && !y.stage.locked && y.pair; }
// The pair's result once every member has picked: BOLD (all bold), or SAFE (agreed, or split).
function pairResult(y, pick) {
  const picks = [y.pick, ...(y.mates || []).map((m) => m.pick)];
  if (pick === 'bold') return `<div class="pres bold"><div class="rt1">🔥 BOLD · ×2</div><div class="rt2">${y.solo ? 'Everything this act pays double.' : 'You agreed. Everything this act pays double.'}</div></div>`;
  return `<div class="pres psafe"><div class="rt1">🛡 SAFE</div><div class="rt2">${picks.includes('bold') && !y.solo ? "You didn't agree, so you play it safe." : 'Caught this act? You keep half.'}</div></div>`;
}
let choiceView = '';
function drawChoice() {
  const ui = $('#choiceui');
  if (!choosing()) { if (!(Y && (Y.phase === 'quiz' || Y.phase === 'hot'))) ui.hidden = true; choiceView = ''; return false; }
  ui.hidden = false;
  const y = Y, g = y.stage, mk = [g.act, y.pick, y.teamPick, (y.mates || []).map((m) => m.pick).join()].join('|');
  if (mk !== choiceView) {
    choiceView = mk;
    const opt = (p, ic, t, d) => `<button class="opt ${p}${y.pick === p ? ' picked' : y.pick ? ' dim' : ''}" type="button" data-p="${p}"><span class="ic">${ic}</span><span><span class="ot">${t}</span><span class="od">${d}</span></span>${y.pick === p ? '<span class="tick">✓</span>' : ''}</button>`;
    const mates = (y.mates || []).map((m) => `<div class="pc">${A.avatar(A.lookOf(m), m.pick ? 'happy' : 'idle', -1)}${esc(first(m.name))}<b class="${m.pick === 'bold' ? 'bo' : m.pick === 'safe' ? 'sa' : 'wt'}">${pickLabel(m.pick)}</b></div>`).join('');
    ui.innerHTML = `<div class="pact">ACT ${g.act}</div><div class="ptitle">${actTitle(g.name)}</div><div class="pq">${y.solo ? 'Pick one:' : `Agree with ${esc(names((y.mates || []).map((m) => m.name)))}:`}</div>`
      + opt('safe', '🛡', 'SAFE', 'Caught? You keep half.') + opt('bold', '🔥', 'BOLD', 'Everything this act pays ×2.')
      + (y.teamPick && y.teamPick !== 'choosing' ? pairResult(y, y.teamPick) : mates ? `<div class="pairc">${mates}</div>` : '')

$('#choiceui').addEventListener('click', (e) => {

const GOAL = `<div class="goal"><span class="g1">🎯 KEEP THE BUSINESS RUNNING</span><span class="g2"><svg width="16" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#ff4fd8"/></svg>AVOID THE SCAMS</span></div>`;
// Your partner's thumb, live and big: blame and credit are visible.
function matesHtml(y) {
  if (!y.mates || !y.mates.length) return '';
  const done = y.phase === 'play' && !['hold', 'wait'].includes(y.state);
  return y.mates.map((m) => {
    const n = esc(first(m.name)), c = A.lookOf(m);
    if (!m.connected) return `<div class="mate off">${A.avatar(c, 'idle', -1)}<span>${n} <b>phone offline</b></span></div>`;
    if (m.away) return `<div class="mate off">${A.avatar(c, 'idle', -1)}<span>${n} <b>stepped away</b></span></div>`;
    if (m.down) return `<div class="mate">${A.avatar(c, 'hold', -1)}<span>${n} <b>is holding</b></span></div>`;
    return `<div class="mate off">${A.avatar(c, 'idle', -1)}<span>${n} <b>${y.phase === 'ready' || y.phase === 'walk' || y.state === 'wait' ? 'not in yet' : done ? 'is off' : 'let go'}</b></span></div>`;
  }).join('');
}
